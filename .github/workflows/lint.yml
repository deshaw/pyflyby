name: Lint

on:
  push:
    branches: [master]
  pull_request:
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: "ubuntu-latest"
    env:
      # Keep `uv run` from re-syncing the project, which would replace the
      # wheel installed below with an editable install.
      UV_NO_SYNC: "1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          "pyproject.toml"

    - name: Install pyflyby
      run: |
        uv python install 3.13
        uv venv
        # Install a real wheel rather than an editable install: meson-python
        # editable wheels omit data scripts, so bin/pyflyby-diff would be
        # missing and the Self-tidy-import step below could not show its diffs.
        uv pip install meson-python meson ninja "pybind11>=2.10.4" "setuptools-scm>=8"
        uv build --wheel --no-build-isolation
        uv pip install -v dist/*.whl --group lint
    - name: Mypy
      run: |
        uv run mypy lib/python --ignore-missing-imports
    - name: lint
      run: |
        uv run flake8 --exclude known_imports,etc,__init__.py,.venv --select=F;
        uv run flake8 --exclude known_imports,etc,__init__.py,.venv --select=F bin/*;
    - name: Self-tidy-import
      run: |
        uv run tidy-imports --actions=DIFF,CHANGEDEXIT1 --no-add lib/python/ tests/
